name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'crafter-lab/circuitkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Detect unpublished version
        id: version
        run: node scripts/npm-release.mjs
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Build and verify
        if: steps.version.outputs.publish == 'true'
        run: |
          bun run build
          bun run typecheck
          bun test ./tests
      - name: Use pinned npm with trusted publishing support
        if: steps.version.outputs.publish == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-cli" --no-package-lock --ignore-scripts --no-audit --no-fund npm@11.16.0 --registry https://registry.npmjs.org
          echo "$RUNNER_TEMP/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Pack the release
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/circuitkit-release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/circuitkit-release" > "$RUNNER_TEMP/circuitkit-release/pack.json"
          node scripts/npm-release.mjs verify-pack "$RUNNER_TEMP/circuitkit-release/pack.json"
      - name: Verify the installed Node package
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CONSUMER="$RUNNER_TEMP/circuitkit-consumer"
          mkdir "$CONSUMER"
          cp scripts/verify-agent-package.mjs "$CONSUMER/verify.mjs"
          printf '{"name":"circuitkit-release-consumer","private":true,"type":"module"}\n' > "$CONSUMER/package.json"
          cd "$CONSUMER"
          npm install --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org "$RUNNER_TEMP/circuitkit-release/circuitkit-$VERSION.tgz"
          node verify.mjs
      - name: Refuse an existing release tag
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists; inspect it before publishing." >&2
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
      - name: Publish using OIDC
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN NPM_CONFIG_USERCONFIG=/dev/null npm publish "$RUNNER_TEMP/circuitkit-release/circuitkit-$VERSION.tgz" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org
      - name: Verify published artifact
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm view "circuitkit@$VERSION" dist.integrity --json --registry https://registry.npmjs.org > "$RUNNER_TEMP/circuitkit-release/published-integrity.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const root = process.env.RUNNER_TEMP + "/circuitkit-release/"; assert.equal(JSON.parse(readFileSync(root + "published-integrity.json")), JSON.parse(readFileSync(root + "pack.json"))[0].integrity);'
      - name: Create tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" "$RUNNER_TEMP/circuitkit-release/circuitkit-$VERSION.tgz" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
